<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">AI prompt privacy and downstream URL access</title>
<desc id="desc">A developer sends a prompt through an AI router to a model provider. A private link inside the prompt is opened by an automated security process, triggering an access warning.</desc>
<rect width="1200" height="630" fill="#0b1725"/><circle cx="1070" cy="90" r="170" fill="#132b43"/><circle cx="95" cy="575" r="210" fill="#10253a"/>
<text x="72" y="70" fill="#77b7f0" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">RAAZIM TECH  /  AI SECURITY</text>
<text x="72" y="132" fill="#ffffff" font-family="Arial,sans-serif" font-size="43" font-weight="700">Where does your prompt go?</text>
<text x="74" y="169" fill="#a9bfd3" font-family="Arial,sans-serif" font-size="20">A privacy flag is only as strong as every processing hop.</text>
<rect x="72" y="222" width="270" height="252" rx="18" fill="#f4f7fb"/><rect x="96" y="248" width="122" height="28" rx="14" fill="#dcecff"/>
<text x="157" y="267" text-anchor="middle" fill="#155c9e" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">AI PROMPT</text><text x="98" y="318" fill="#14263a" font-family="Arial,sans-serif" font-size="20" font-weight="700">Developer request</text>
<rect x="98" y="339" width="208" height="11" rx="5" fill="#c7d3df"/><rect x="98" y="361" width="174" height="11" rx="5" fill="#c7d3df"/><rect x="98" y="383" width="188" height="11" rx="5" fill="#c7d3df"/>
<rect x="98" y="416" width="214" height="36" rx="8" fill="#fff0ed" stroke="#e58a78"/><circle cx="117" cy="434" r="6" fill="#d64b39"/><text x="133" y="439" fill="#9a3428" font-family="Arial,sans-serif" font-size="13" font-weight="700">private link + secret</text>
<path d="M342 348 H422" stroke="#78baf3" stroke-width="5" stroke-linecap="round"/><path d="M410 335 L424 348 L410 361" fill="none" stroke="#78baf3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="430" y="278" width="190" height="140" rx="16" fill="#17324b" stroke="#42627f" stroke-width="2"/><circle cx="525" cy="321" r="24" fill="#22527b"/><path d="M515 321h20M525 311v20" stroke="#d8ebff" stroke-width="3" stroke-linecap="round"/>
<text x="525" y="369" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="19" font-weight="700">AI router</text><text x="525" y="393" text-anchor="middle" fill="#b8cde0" font-family="Arial,sans-serif" font-size="13">provider hand-off</text>
<path d="M620 348 H704" stroke="#78baf3" stroke-width="5" stroke-linecap="round"/><path d="M692 335 L706 348 L692 361" fill="none" stroke="#78baf3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="714" y="278" width="190" height="140" rx="16" fill="#17324b" stroke="#42627f" stroke-width="2"/><rect x="772" y="300" width="74" height="44" rx="8" fill="#22527b"/><path d="M784 314h50M784 326h36" stroke="#d8ebff" stroke-width="3" stroke-linecap="round"/>
<text x="809" y="369" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Model API</text><text x="809" y="393" text-anchor="middle" fill="#b8cde0" font-family="Arial,sans-serif" font-size="13">downstream host</text>
<path d="M904 348 C956 348 954 260 1010 260" stroke="#e76c5b" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M998 248 L1012 260 L998 272" stroke="#e76c5b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect x="1007" y="204" width="125" height="116" rx="16" fill="#4a2530" stroke="#d96c60" stroke-width="2"/><path d="M1069 224l27 10v22c0 20-12 34-27 41-15-7-27-21-27-41v-22z" fill="#d64b39"/><path d="M1069 241v18M1069 270v2" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="1069" y="344" text-anchor="middle" fill="#ffd5cf" font-family="Arial,sans-serif" font-size="14" font-weight="700">URL accessed</text>
<rect x="430" y="458" width="702" height="66" rx="12" fill="#162b40" stroke="#314a63"/><text x="456" y="485" fill="#ffb7aa" font-family="Arial,sans-serif" font-size="17" font-weight="700">ZERO RETENTION ≠ ZERO ACCESS</text><text x="456" y="508" fill="#c1d0de" font-family="Arial,sans-serif" font-size="14">Routing, logging and automated checks can expose link data downstream.</text>
<text x="72" y="578" fill="#7f9bb4" font-family="Arial,sans-serif" font-size="15">Illustrative diagram · Not a representation of MiniMax's internal network</text>
