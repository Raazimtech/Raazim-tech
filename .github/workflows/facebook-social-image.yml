name: Publish Raazim Tech engagement image

on:
  push:
    branches: [main]
    paths:
      - "social/post-ready.txt"

permissions:
  contents: read

concurrency:
  group: raazim-social-image-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble generated image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/raazim-social
          cat social/data/part-*.txt | tr -d '\r\n ' | base64 --decode > /tmp/raazim-social/post.jpg
          test -s /tmp/raazim-social/post.jpg
          python - <<'PY'
          from pathlib import Path
          data = Path("/tmp/raazim-social/post.jpg").read_bytes()
          if not data.startswith(b"\xff\xd8\xff"):
              raise SystemExit("Assembled asset is not a JPEG.")
          print(f"Image ready ({len(data)} bytes).")
          PY

      - name: Publish image to Raazim Tech Facebook Page
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GRAPH_API_VERSION: v27.0
          POST_CAPTION: |
            Everyone has something they wish they'd learned sooner.

            Maybe it's about money, relationships, work, health, or simply life. What's one lesson you learned that you wish you knew earlier?

            Share it in the comments. Your advice might be exactly what someone else needs to hear.

            #RaazimTech #LifeLessons #Community
          POST_MARKER: "[RT-ENGAGEMENT-QUESTION-20261125]"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FB_PAGE_ID" || -z "$FB_PAGE_ACCESS_TOKEN" ]]; then
            echo "Missing FB_PAGE_ID or FB_PAGE_ACCESS_TOKEN GitHub secret."
            exit 1
          fi
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error, sys
          page_id = os.environ["FB_PAGE_ID"].strip()
          token = os.environ["FB_PAGE_ACCESS_TOKEN"].strip()
          version = os.environ["GRAPH_API_VERSION"]
          marker = os.environ["POST_MARKER"]
          url = f"https://graph.facebook.com/{version}/{page_id}/published_posts?" + urllib.parse.urlencode({
              "fields": "message,permalink_url",
              "limit": "100",
              "access_token": token
          })
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "RaazimTechPublisher/1.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  posts = json.loads(response.read().decode("utf-8")).get("data", [])
              for post in posts:
                  if marker in post.get("message", ""):
                      print("This engagement post has already been published; skipping duplicate.")
                      print(post.get("permalink_url", "Existing post found."))
                      sys.exit(0)
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", "replace")
              raise SystemExit(f"Could not check existing Page posts (HTTP {exc.code}): {detail}")
          PY
          response="$(curl --fail --silent --show-error \
            -F "source=@/tmp/raazim-social/post.jpg;type=image/jpeg" \
            --form-string "caption=$POST_CAPTION" \
            --form-string "published=true" \
            --form-string "access_token=$FB_PAGE_ACCESS_TOKEN" \
            "https://graph.facebook.com/$GRAPH_API_VERSION/$FB_PAGE_ID/photos")"
          echo "$response" | python -c 'import json,sys; r=json.load(sys.stdin); print("Published image post."); print("Photo ID:",r.get("id","not returned")); print("Post ID:",r.get("post_id","not returned"));'
