name: Remove hero frame

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove reference-image crop frame
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('.hero-shell{padding:14px 14px 0}', '.hero-shell{padding:0}')
          s = s.replace('.hero{min-height:calc(100vh - 28px);min-height:720px;', '.hero{min-height:100vh;min-height:720px;')
          s = s.replace('.hero-content{position:relative;z-index:2;min-height:calc(100vh - 28px);min-height:720px;', '.hero-content{position:relative;z-index:2;min-height:100vh;min-height:720px;')
          s = s.replace('.hero-shell{padding:7px 7px 0}.hero,.hero-content{min-height:780px}', '.hero-shell{padding:0}.hero,.hero-content{min-height:780px}')
          p.write_text(s)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm -f .github/workflows/remove-hero-frame.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/remove-hero-frame.yml
          git diff --cached --quiet || git commit -m 'Remove white hero frame from reference-inspired design'
          git push
