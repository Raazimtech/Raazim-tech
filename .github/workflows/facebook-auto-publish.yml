name: Publish new articles to Facebook

on:
  push:
    branches: [main]
    paths:
      - "news/*.html"
      - "blog/*.html"
  workflow_dispatch:
    inputs:
      article_path:
        description: "Repository path to an article HTML file (for a manual test)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: facebook-article-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select published article
        id: article
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PATH: ${{ inputs.article_path }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            path="$INPUT_PATH"
          else
            path="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'news/*.html' 'blog/*.html' | head -n 1)"
          fi
          if [[ -z "$path" || ! -f "$path" ]]; then
            echo "No article HTML file found in this event."
            exit 1
          fi
          case "$path" in
            news/*.html|blog/*.html) ;;
            *) echo "Refusing to publish a file outside news/ or blog/."; exit 1 ;;
          esac
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Publish article to Raazim Tech Facebook Page
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          ARTICLE_PATH: ${{ steps.article.outputs.path }}
          SITE_BASE: https://raazimtech.github.io/Raazim-tech
          GRAPH_API_VERSION: v27.0
        run: |
          python - <<'PY'
          import os, re, json, html, urllib.parse, urllib.request, urllib.error
          from html.parser import HTMLParser
          from pathlib import Path

          page_id = os.environ["FB_PAGE_ID"].strip()
          token = os.environ["FB_PAGE_ACCESS_TOKEN"].strip()
          path = os.environ["ARTICLE_PATH"]
          site_base = os.environ["SITE_BASE"].rstrip("/")
          version = os.environ["GRAPH_API_VERSION"]
          if not page_id or not token:
              raise SystemExit("Missing FB_PAGE_ID or FB_PAGE_ACCESS_TOKEN GitHub secret.")

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta = {}
                  self.title = False
                  self.title_text = []
                  self.h1 = False
                  self.h1_text = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag.lower() == "meta":
                      key = attrs.get("property") or attrs.get("name")
                      value = attrs.get("content")
                      if key and value:
                          self.meta[key.lower()] = value.strip()
                  if tag.lower() == "title":
                      self.title = True
                  if tag.lower() == "h1":
                      self.h1 = True
              def handle_endtag(self, tag):
                  if tag.lower() == "title":
                      self.title = False
                  if tag.lower() == "h1":
                      self.h1 = False
              def handle_data(self, data):
                  if self.title: self.title_text.append(data)
                  if self.h1: self.h1_text.append(data)

          raw = Path(path).read_text(encoding="utf-8")
          parser = MetaParser()
          parser.feed(raw)
          meta = parser.meta
          slug = Path(path).stem
          section = "Tech News" if path.startswith("news/") else "Raazim Tech Blog"
          canonical = meta.get("og:url") or meta.get("twitter:url") or f"{site_base}/{path}"
          if canonical.startswith("/"):
              canonical = site_base + canonical
          title = meta.get("og:title") or meta.get("twitter:title") or meta.get("title") or " ".join(parser.h1_text).strip() or " ".join(parser.title_text).strip()
          description = meta.get("og:description") or meta.get("description") or meta.get("twitter:description") or ""
          image = meta.get("og:image") or meta.get("twitter:image")
          if image and image.startswith("/"):
              image = site_base + image
          if not title:
              raise SystemExit(f"Could not extract a title from {path}.")
          if not canonical.startswith("https://"):
              raise SystemExit(f"Invalid canonical article URL: {canonical}")
          caption = f"{title}\n\n{description}\n\nRead the full {section} article: {canonical}\n\nRaazim Tech"
          caption = re.sub(r"\n{3,}", "\n\n", caption).strip()

          base = f"https://graph.facebook.com/{version}/{page_id}"
          def api_get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "RaazimTechPublisher/1.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          # Avoid duplicate posts when GitHub Actions retries the same article.
          feed_url = base + "/published_posts?" + urllib.parse.urlencode({
              "fields": "message,permalink_url",
              "limit": "100",
              "access_token": token
          })
          try:
              feed = api_get(feed_url)
              for post in feed.get("data", []):
                  message = post.get("message", "")
                  if canonical in message:
                      print("This article is already present on the Page; skipping duplicate publication.")
                      print(post.get("permalink_url", "Existing post found."))
                      raise SystemExit(0)
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", "replace")
              raise SystemExit(f"Could not check existing Page posts (HTTP {exc.code}): {detail}")

          endpoint = base + ("/photos" if image else "/feed")
          fields = {"access_token": token, "caption" if image else "message": caption}
          if image:
              fields["url"] = image
              print(f"Publishing with cover image: {image}")
          else:
              fields["link"] = canonical
              print("No article cover image metadata found; publishing a link post.")
          data = urllib.parse.urlencode(fields).encode()
          req = urllib.request.Request(endpoint, data=data, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", "replace")
              raise SystemExit(f"Facebook Graph API rejected the post (HTTP {exc.code}): {detail}")
          post_id = result.get("post_id") or result.get("id")
          if not post_id:
              raise SystemExit(f"Facebook API returned no post ID: {json.dumps(result)}")
          print(f"Published {section}: {title}")
          print(f"Article: {canonical}")
          print(f"Facebook post ID: {post_id}")
          PY
