<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Progressive Web App architecture</title><desc id="desc">A web app connects to a manifest for installation, a service worker for request handling, local cache for selected assets, and a network for live content.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1725"/><stop offset="1" stop-color="#183654"/></linearGradient></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/><circle cx="1060" cy="95" r="180" fill="#4d97e6" opacity=".08"/><circle cx="130" cy="585" r="220" fill="#4d97e6" opacity=".06"/>
<text x="70" y="100" fill="#77b9ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="4">RAAZIM TECH INSIGHTS</text>
<text x="70" y="178" fill="#fff" font-family="Arial,sans-serif" font-size="51" font-weight="700">PROGRESSIVE WEB APPS</text>
<text x="72" y="220" fill="#b9c9da" font-family="Arial,sans-serif" font-size="23">One web app. An installable shell. Carefully chosen offline support.</text>
<g font-family="Arial,sans-serif">
<rect x="70" y="300" width="255" height="170" rx="16" fill="#fff"/><text x="98" y="350" fill="#1767ae" font-size="18" font-weight="700">01 · WEBSITE</text><text x="98" y="394" fill="#0b1725" font-size="29" font-weight="700">HTML · CSS</text><text x="98" y="430" fill="#0b1725" font-size="29" font-weight="700">JavaScript</text>
<rect x="382" y="300" width="245" height="170" rx="16" fill="#eaf3fc"/><text x="408" y="350" fill="#1767ae" font-size="18" font-weight="700">02 · MANIFEST</text><text x="408" y="397" fill="#0b1725" font-size="28" font-weight="700">Name + icons</text><text x="408" y="433" fill="#526174" font-size="20">Start URL · display</text>
<rect x="682" y="300" width="235" height="170" rx="16" fill="#eaf3fc"/><text x="708" y="350" fill="#1767ae" font-size="18" font-weight="700">03 · SERVICE WORKER</text><text x="708" y="397" fill="#0b1725" font-size="28" font-weight="700">Fetch control</text><text x="708" y="433" fill="#526174" font-size="20">Offline strategy</text>
<rect x="970" y="270" width="165" height="115" rx="14" fill="#fff"/><text x="992" y="313" fill="#1767ae" font-size="16" font-weight="700">LOCAL CACHE</text><text x="992" y="352" fill="#0b1725" font-size="22" font-weight="700">Saved files</text>
<rect x="970" y="410" width="165" height="115" rx="14" fill="#fff"/><text x="992" y="453" fill="#1767ae" font-size="16" font-weight="700">NETWORK</text><text x="992" y="492" fill="#0b1725" font-size="22" font-weight="700">Live data</text>
<g stroke="#77b9ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M325 385 H382"/><path d="M627 385 H682"/><path d="M917 350 H946 V327 H970"/><path d="M917 420 H946 V467 H970"/></g>
<g fill="#77b9ff"><path d="M373 377 l12 8 -12 8z"/><path d="M673 377 l12 8 -12 8z"/><path d="M962 319 l12 8 -12 8z"/><path d="M962 459 l12 8 -12 8z"/></g>
<text x="70" y="575" fill="#b9c9da" font-size="20">Installability and offline capability are related, but they are not the same feature.</text>
</g></svg>