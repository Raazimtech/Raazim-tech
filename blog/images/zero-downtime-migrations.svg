<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Expand-and-contract database migration</title><desc id="desc">A staged database migration: expand schema, deploy compatible code, backfill and verify, then contract old schema.</desc><rect width="1200" height="675" fill="#f4f6f8"/><text x="80" y="105" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0b1725">SAFE DATABASE CHANGE</text><text x="80" y="155" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#0b1725">Expand → migrate → contract</text><g font-family="Arial,sans-serif"><rect x="80" y="245" width="235" height="220" rx="18" fill="#fff" stroke="#cbd7e4" stroke-width="3"/><rect x="365" y="245" width="235" height="220" rx="18" fill="#fff" stroke="#4d97e6" stroke-width="3"/><rect x="650" y="245" width="235" height="220" rx="18" fill="#fff" stroke="#4d97e6" stroke-width="3"/><rect x="935" y="245" width="185" height="220" rx="18" fill="#0b1725"/><g fill="#0b1725" font-size="28" font-weight="700"><text x="112" y="300">1. EXPAND</text><text x="397" y="300">2. DEPLOY</text><text x="682" y="300">3. BACKFILL</text></g><g fill="#526174" font-size="21"><text x="112" y="350">Add new columns</text><text x="112" y="383">Keep old schema</text><text x="397" y="350">Support both</text><text x="397" y="383">versions safely</text><text x="682" y="350">Copy in batches</text><text x="682" y="383">Verify consistency</text></g><text x="966" y="300" fill="#fff" font-size="27" font-weight="700">4. CONTRACT</text><text x="966" y="350" fill="#cbd7e4" font-size="20">Remove old</text><text x="966" y="380" fill="#cbd7e4" font-size="20">schema later</text><g stroke="#4d97e6" stroke-width="5" fill="none"><path d="M320 355h38m-12-12 12 12-12 12"/><path d="M605 355h38m-12-12 12 12-12 12"/><path d="M890 355h38m-12-12 12 12-12 12"/></g></g><text x="80" y="555" font-family="Arial,sans-serif" font-size="24" fill="#657284">Compatible releases. Resumable backfills. Verified cleanup.</text></svg>