<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Reliable webhook processing flow</title>
<desc id="desc">A webhook sender reaches a signature-verifying endpoint, which stores the event in a durable inbox before acknowledging it. A background worker then applies an idempotent business update and records the result.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#4d97e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1725" flood-opacity=".08"/></filter>
</defs>
<rect width="1200" height="675" fill="#f4f6f8"/>
<text x="58" y="76" fill="#2876c8" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">BACKEND ENGINEERING</text>
<text x="58" y="126" fill="#0b1725" font-family="Arial,sans-serif" font-size="40" font-weight="700">Acknowledge only after durable storage</text>
<text x="58" y="163" fill="#657284" font-family="Arial,sans-serif" font-size="19">Retries are normal. Your business side effects must be safe to repeat.</text>
<g filter="url(#shadow)">
  <rect x="48" y="238" width="190" height="190" rx="18" fill="#fff" stroke="#dce3eb"/>
  <rect x="278" y="238" width="190" height="190" rx="18" fill="#fff" stroke="#dce3eb"/>
  <rect x="508" y="238" width="190" height="190" rx="18" fill="#eaf3fc" stroke="#9bc6ee" stroke-width="2"/>
  <rect x="738" y="238" width="190" height="190" rx="18" fill="#fff" stroke="#dce3eb"/>
  <rect x="968" y="238" width="184" height="190" rx="18" fill="#fff" stroke="#dce3eb"/>
</g>
<g fill="none" stroke="#4d97e6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M238 333 H266" marker-end="url(#arrow)"/>
  <path d="M468 333 H496" marker-end="url(#arrow)"/>
  <path d="M698 333 H726" marker-end="url(#arrow)"/>
  <path d="M928 333 H956" marker-end="url(#arrow)"/>
</g>
<g stroke="#1767ae" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M111 292 h64 l-8 10 h-48z"/><path d="M111 302 v35 l32 18 32-18 v-35"/><path d="M143 355 v18"/>
  <path d="M331 286 h84 a10 10 0 0 1 10 10 v55 a10 10 0 0 1-10 10 h-84 a10 10 0 0 1-10-10 v-55 a10 10 0 0 1 10-10z"/><path d="M339 307 l14 13 27-25"/><path d="M339 337 h48"/>
  <ellipse cx="603" cy="292" rx="43" ry="14"/><path d="M560 292 v48 c0 8 19 14 43 14s43-6 43-14v-48"/><path d="M560 316 c0 8 19 14 43 14s43-6 43-14"/>
  <path d="M790 290 h86 v68 h-86z"/><path d="M806 310 h54 M806 326 h54 M806 342 h32"/><path d="M833 277 v13"/>
  <path d="M1013 296 h95 v57 h-95z"/><path d="M1027 312 h67 M1027 328 h67 M1027 344 h40"/><path d="M1035 370 h50"/>
</g>
<g fill="#0b1725" font-family="Arial,sans-serif" text-anchor="middle">
  <text x="143" y="397" font-size="18" font-weight="700">Provider</text>
  <text x="373" y="397" font-size="18" font-weight="700">Verify request</text>
  <text x="603" y="397" font-size="18" font-weight="700">Durable inbox</text>
  <text x="833" y="397" font-size="18" font-weight="700">Worker</text>
  <text x="1060" y="397" font-size="18" font-weight="700">Business state</text>
</g>
<g fill="#657284" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">
  <text x="143" y="451">Event is sent</text>
  <text x="373" y="451">Check signature</text>
  <text x="603" y="451">Unique event ID</text>
  <text x="833" y="451">Retry on failure</text>
  <text x="1060" y="451">Idempotent update</text>
</g>
<rect x="170" y="525" width="860" height="74" rx="14" fill="#0b1725"/>
<text x="600" y="556" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Duplicate delivery → same unique key → one accepted inbox record</text>
<text x="600" y="581" fill="#b9c7d6" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">The sender gets a fast 2xx only after the event is safely stored.</text>
</svg>